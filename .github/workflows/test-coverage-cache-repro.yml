#
# DISPOSABLE DEBUG WORKFLOW - not for merging into main.
# Purpose: determine whether `bazel coverage` test actions can be served from
# the disk-cache at all, by running the SAME coverage invocation twice in a
# row within the same job (same disk-cache, no source changes in between).
name: "[debug] Coverage cache repro"
on:
  workflow_dispatch:
concurrency:
  group: coverage-cache-repro
  cancel-in-progress: true
jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - name: Clean disk space
        uses: eclipse-score/more-disk-space@v1.1
        with:
          level: 4
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: coverage-cache-repro
          repository-cache: true
          cache-save: false
      - name: "Run bazel coverage: variant 4 - does switching --instrumentation_filter between modules invalidate cache?"
        run: |
          echo "##[group]=== RUN A: score_kyron (fresh) ==="
          bazel coverage --test_verbose_timeout_warnings --test_timeout=1200 \
            --config=unit-tests --config=ferrocene-coverage \
            --test_summary=testcase --test_output=errors \
            --instrumentation_filter=@score_kyron \
            @score_kyron//src/...
          echo "##[endgroup]"
          echo "##[group]=== RUN B: score_persistency (different instrumentation_filter + extra flags) ==="
          bazel coverage --test_verbose_timeout_warnings --test_timeout=1200 \
            --config=unit-tests --config=ferrocene-coverage \
            --test_summary=testcase --test_output=errors \
            --instrumentation_filter=@score_persistency \
            @score_persistency//score/kvs/... \
            --@score_baselibs//score/log_rust:safety_level=qm \
            --@score_baselibs//score/json:base_library=nlohmann \
            --@score_logging//score/mw/log/flags:KRemote_Logging=False \
            -- \
            -@score_persistency//score/kvs/tests:bm_kvs_cpp \
            -@score_persistency//score/kvs/tests/integration_test_scenarios/... \
            -@score_persistency//score/kvs/tests/test_cases/...
          echo "##[endgroup]"
          echo "##[group]=== bazel shutdown (force a brand-new server) ==="
          bazel shutdown
          echo "##[endgroup]"
          echo "##[group]=== RUN C: score_kyron AGAIN (identical flags to RUN A, fresh server, same disk-cache) ==="
          bazel coverage --test_verbose_timeout_warnings --test_timeout=1200 \
            --config=unit-tests --config=ferrocene-coverage \
            --test_summary=testcase --test_output=errors \
            --instrumentation_filter=@score_kyron \
            @score_kyron//src/...
          echo "##[endgroup]"
