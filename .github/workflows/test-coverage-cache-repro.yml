#
# DISPOSABLE DEBUG WORKFLOW - not for merging into main.
# Purpose: variant 5 - does a REAL GitHub Actions cache round-trip (tar upload
# in one job/runner, tar download in a completely separate job/runner) preserve
# disk-cache fidelity for bazel coverage test actions, the way a plain
# `bazel shutdown` within the same job/runner does?
name: "[debug] Coverage cache repro"
on:
  workflow_dispatch:
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Clean disk space
        uses: eclipse-score/more-disk-space@v1.1
        with:
          level: 4
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: coverage-cache-repro-v5
          repository-cache: true
          cache-save: true
      - name: "RUN 1: score_kyron (fresh, this job SAVES the disk-cache to GH Actions cache)"
        run: |
          bazel coverage --test_verbose_timeout_warnings --test_timeout=1200 \
            --config=unit-tests --config=ferrocene-coverage \
            --test_summary=testcase --test_output=errors \
            --instrumentation_filter=@score_kyron \
            @score_kyron//src/...
  restore:
    needs: save
    runs-on: ubuntu-latest
    steps:
      - name: Clean disk space
        uses: eclipse-score/more-disk-space@v1.1
        with:
          level: 4
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: coverage-cache-repro-v5
          repository-cache: true
          cache-save: false
      - name: "RUN 2: score_kyron AGAIN, IDENTICAL flags, but on a completely separate runner/VM"
        run: |
          bazel coverage --test_verbose_timeout_warnings --test_timeout=1200 \
            --config=unit-tests --config=ferrocene-coverage \
            --test_summary=testcase --test_output=errors \
            --instrumentation_filter=@score_kyron \
            @score_kyron//src/...

